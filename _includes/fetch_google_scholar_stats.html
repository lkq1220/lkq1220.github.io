<script>
  (function () {
    {% if site.google_scholar_stats_use_cdn %}
    var gsDataUrl = 'https://cdn.jsdelivr.net/gh/{{ site.repository }}@google-scholar-stats/gs_data.json';
    {% else %}
    var gsDataUrl = 'https://raw.githubusercontent.com/{{ site.repository }}/google-scholar-stats/gs_data.json';
    {% endif %}
    var statsPromise = null;

    function cleanTitle(title) {
      return String(title || '')
        .replace(/<[^>]*>/g, ' ')
        .replace(/\s+/g, ' ')
        .replace(/^[\s"'\u201c\u201d]+|[\s"'\u201c\u201d]+$/g, '')
        .replace(/[,.，。;；:：]+$/g, '')
        .trim();
    }

    function normalizeTitle(title) {
      return cleanTitle(title)
        .toLowerCase()
        .replace(/&/g, 'and')
        .replace(/[^a-z0-9]/g, '');
    }

    function titleTokens(title) {
      return cleanTitle(title)
        .toLowerCase()
        .replace(/&/g, ' and ')
        .replace(/[^a-z0-9]+/g, ' ')
        .split(' ')
        .filter(function (token) {
          return token.length > 1;
        });
    }

    function getSectionHeading(item) {
      var list = item.closest('ol');
      var node = list ? list.previousElementSibling : null;
      while (node) {
        if (/^H[1-6]$/.test(node.tagName)) {
          return node.textContent || '';
        }
        node = node.previousElementSibling;
      }
      return '';
    }

    function getTitleLink(item) {
      var links = Array.prototype.slice.call(item.querySelectorAll('a[href]'));
      return links.find(function (link) {
        return !link.classList.contains('pub-badge') &&
          !link.classList.contains('pub-code') &&
          link.href.indexOf('github.com') === -1;
      }) || null;
    }

    function getPublicationTitle(item) {
      var titleLink = getTitleLink(item);
      if (titleLink && titleLink.textContent.trim()) {
        return cleanTitle(titleLink.textContent);
      }

      var text = item.textContent.replace(/\s+/g, ' ').trim();
      var match = text.match(/["\u201c](.+?)["\u201d]/);
      return match ? cleanTitle(match[1]) : '';
    }

    function insertAfter(referenceNode, newNode) {
      referenceNode.parentNode.insertBefore(newNode, referenceNode.nextSibling);
    }

    function removeNode(node) {
      if (node && node.parentNode) {
        node.parentNode.removeChild(node);
      }
    }

    function getCodeBadge(item) {
      return item.querySelector('a.pub-code');
    }

    function getPublicationContainer(item) {
      var paragraphs = item.querySelectorAll('p');
      return paragraphs.length ? paragraphs[paragraphs.length - 1] : item;
    }

    function glueSpace() {
      return document.createTextNode('\u00a0');
    }

    function placeBadge(item, badge) {
      removeNode(badge);

      var codeBadge = getCodeBadge(item);
      if (codeBadge) {
        var codeSpace = glueSpace();
        insertAfter(codeBadge, codeSpace);
        insertAfter(codeSpace, badge);
        return;
      }

      var container = getPublicationContainer(item);
      container.appendChild(glueSpace());
      container.appendChild(badge);
    }

    function ensureCitationBadges() {
      if (!document.querySelector('.subnav a[href="#journal-lead"]')) {
        return [];
      }

      return Array.prototype.slice
        .call(document.querySelectorAll('#pjax-container ol > li'))
        .map(function (item) {
          var sectionHeading = getSectionHeading(item);
          var badge = item.querySelector('.show_paper_citations');
          if (/patent/i.test(sectionHeading) || /\bsubmitted\b/i.test(item.textContent || '')) {
            removeNode(badge);
            return null;
          }

          if (!badge) {
            var title = getPublicationTitle(item);
            if (!title) {
              return null;
            }
            badge = document.createElement('span');
            badge.className = 'pub-badge pub-citation show_paper_citations';
            badge.setAttribute('data-title', title);
            badge.textContent = 'Citations: ...';
          }

          if (badge.getAttribute('data-placed') !== 'inside-publication') {
            placeBadge(item, badge);
            badge.setAttribute('data-placed', 'inside-publication');
          }

          return badge;
        })
        .filter(Boolean);
    }

    function publicationTitles(publication) {
      var bib = publication.bib || {};
      return [
        bib.title,
        bib.citation_title,
        publication.title,
        publication.name
      ].map(cleanTitle).filter(Boolean);
    }

    function buildPublicationIndex(publications) {
      var exact = {};
      var entries = [];

      Object.keys(publications || {}).forEach(function (paperId) {
        var publication = publications[paperId] || {};
        exact[paperId] = publication;

        publicationTitles(publication).forEach(function (title) {
          var normalizedTitle = normalizeTitle(title);
          if (!normalizedTitle) {
            return;
          }

          exact[normalizedTitle] = publication;
          entries.push({
            publication: publication,
            normalizedTitle: normalizedTitle,
            tokens: titleTokens(title)
          });
        });
      });

      return {
        exact: exact,
        entries: entries
      };
    }

    function tokenScore(leftTokens, rightTokens) {
      if (!leftTokens.length || !rightTokens.length) {
        return 0;
      }

      var right = {};
      rightTokens.forEach(function (token) {
        right[token] = true;
      });

      var shared = leftTokens.filter(function (token) {
        return right[token];
      }).length;

      return shared / Math.max(leftTokens.length, rightTokens.length);
    }

    function findPublication(element, publications, publicationIndex) {
      var paperId = element.getAttribute('data-scholar-id') || element.getAttribute('data');
      if (paperId && publications[paperId]) {
        return publications[paperId];
      }

      var title = element.getAttribute('data-title');
      var normalizedTitle = normalizeTitle(title);
      if (!normalizedTitle) {
        return null;
      }
      if (publicationIndex.exact[normalizedTitle]) {
        return publicationIndex.exact[normalizedTitle];
      }

      var tokens = titleTokens(title);
      var bestMatch = null;
      var bestScore = 0;

      publicationIndex.entries.forEach(function (entry) {
        var score = tokenScore(tokens, entry.tokens);
        if (
          normalizedTitle.length >= 20 &&
          entry.normalizedTitle.length >= 20 &&
          (entry.normalizedTitle.indexOf(normalizedTitle) !== -1 ||
            normalizedTitle.indexOf(entry.normalizedTitle) !== -1)
        ) {
          score = Math.max(score, 0.95);
        }

        if (score > bestScore) {
          bestScore = score;
          bestMatch = entry.publication;
        }
      });

      return bestScore >= 0.7 ? bestMatch : null;
    }

    function getCitationCount(publication) {
      if (!publication) {
        return null;
      }

      var count = publication.num_citations;
      if (count === undefined || count === null) {
        count = publication.citedby;
      }

      count = Number.parseInt(count, 10);
      return Number.isFinite(count) ? count : null;
    }

    function renderCitationStats(data) {
      var publications = (data && data.publications) || {};
      var publicationIndex = buildPublicationIndex(publications);
      var hasPublicationData = publicationIndex.entries.length > 0;
      var totalCitation = document.getElementById('total_cit');

      if (totalCitation) {
        totalCitation.textContent =
          data && data.citedby !== undefined && (hasPublicationData || !data.citation_fetch_error)
            ? data.citedby
            : '--';
      }

      ensureCitationBadges().forEach(function (element) {
        var publication = hasPublicationData
          ? findPublication(element, publications, publicationIndex)
          : null;
        var count = getCitationCount(publication);

        element.classList.remove('is-loaded', 'is-unmatched');
        if (count === null) {
          element.textContent = 'Citations: --';
          element.classList.add('is-unmatched');
          element.title = 'No matching Google Scholar record was found.';
          return;
        }

        element.textContent = 'Citations: ' + count;
        element.classList.add('is-loaded');
        element.removeAttribute('title');
      });
    }

    window.refreshGoogleScholarStats = function () {
      ensureCitationBadges();

      if (!statsPromise) {
        statsPromise = fetch(gsDataUrl, { cache: 'no-store' })
          .then(function (response) {
            if (!response.ok) {
              throw new Error('Could not load Google Scholar citation data');
            }
            return response.json();
          })
          .catch(function (error) {
            console.warn(error);
            statsPromise = null;
            renderCitationStats(null);
            return null;
          });
      }

      return statsPromise.then(function (data) {
        if (data) {
          renderCitationStats(data);
        }
      });
    };

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', window.refreshGoogleScholarStats);
    } else {
      window.refreshGoogleScholarStats();
    }
  })();
</script>
