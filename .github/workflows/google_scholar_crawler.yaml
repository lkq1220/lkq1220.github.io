name: Get Citation Data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GOOGLE_SCHOLAR_ID: g9xvPCAAAAAJ
      SCHOLARLY_TIMEOUT_SECONDS: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt

      - name: Restore previous citation data
        run: |
          mkdir -p google_scholar_crawler/results
          if git fetch origin google-scholar-stats:google-scholar-stats; then
            if git show google-scholar-stats:gs_data.json > /tmp/gs_data.json 2>/dev/null; then
              mv /tmp/gs_data.json google_scholar_crawler/results/gs_data.json
            fi
            if git show google-scholar-stats:gs_data_shieldsio.json > /tmp/gs_data_shieldsio.json 2>/dev/null; then
              mv /tmp/gs_data_shieldsio.json google_scholar_crawler/results/gs_data_shieldsio.json
            fi
          fi

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r google_scholar_crawler/requirements.txt

      - name: Fetch citation data
        run: python google_scholar_crawler/main.py

      - name: Publish citation data
        run: |
          cd google_scholar_crawler/results
          git init
          git checkout -b google-scholar-stats
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gs_data.json gs_data_shieldsio.json
          git commit -m "Updated Citation Data"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:google-scholar-stats --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
